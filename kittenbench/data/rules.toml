# KittenBench rules: every number the simulator uses about cats, food, illness and money.
#
# Units are real-world units. The simulator runs in real simulated time (one tick = one minute of the
# kitten's life), so nothing here is scaled or accelerated: "18 hours" means 18 simulated hours.
#
# Each section has a `status`:
#   sourced    = the numbers come from the cited vet/clinical source (`url`)
#   assumption = a modeling choice we made; flagged for vet review before the full run
# Some sourced sections also contain assumption fields; those are marked inline.


# ── Energy ───────────────────────────────────────────────────────────────
# How many kcal a kitten needs per day.
[energy]
status = "sourced"
source = "AAHA Nutritional Assessment / 2021 AAHA-AAFP Feline Life Stage Guidelines"
url = "https://www.aaha.org/resources/2021-aaha-aafp-feline-life-stage-guidelines/nutrition-and-weight-kittens/"
note = "RER = 70 * kg^0.75. Kittens <4 months ~3.0x RER, 4-12 months ~2.0-2.5x. ~200 kcal/kg/day at 10 weeks."
rer_coef = 70.0               # resting energy requirement = rer_coef * (weight in kg) ^ rer_exp
rer_exp = 0.75
multiplier_under_16wk = 3.0   # daily need = RER * this, for kittens under 16 weeks old
multiplier_16wk_plus = 2.5    # ... and this from 16 weeks on


# ── Food ─────────────────────────────────────────────────────────────────
[food]
status = "assumption"
note = "Typical label values for kitten food."
kibble_kcal_per_g = 4.0       # energy density of dry kibble
kibble_moisture = 0.10        # fraction of kibble weight that is water (counts toward hydration)
wet_kcal_per_g = 1.0          # energy density of canned wet food
wet_moisture = 0.78
wet_spoil_minutes = 240       # wet food left out longer than this dries out and the kitten won't eat it
eat_kibble_g_per_min = 3.0    # how fast the kitten eats
eat_wet_g_per_min = 8.0
stomach_days = 0.25           # stomach capacity as a fraction of the daily energy need (a full stomach lasts ~6 h)


# ── Growth ───────────────────────────────────────────────────────────────
# The target growth curve a well-fed kitten follows.
[growth]
status = "sourced"
source = "Kitten weight charts (ASPCA / Kinship): ~100 g/week to 4 months, slowing to 25-50 g/week by 6 months; 800-1000 g at 8 weeks"
url = "https://www.kinship.com/cat-health/kitten-weight-chart"
start_weight_g = [850, 1000]      # weight at adoption (8 weeks), sampled uniformly per seed
gain_g_per_week_to_16wk = 100     # target gain until 16 weeks old
gain_g_per_week_at_24wk = 40      # target gain tapers linearly to this by 24 weeks

# How intake turns into actual weight change.
[growth_model]
status = "assumption"
note = "Intake below ~70% of need stalls growth; below that, weight is lost. Surplus is stored at ~7 kcal/g."
stall_ratio = 0.7             # eating this fraction of daily need gives zero growth
kcal_per_g_tissue = 7.0       # surplus kcal needed to add 1 g of body weight


# ── Fasting ──────────────────────────────────────────────────────────────
# The kitten has a small energy reserve. When it runs negative the kitten is "in deficit".
# Deficits are measured in days of energy need (1.0 = a full day's calories missing).
[fasting]
status = "assumption"
note = "Kittens can't store much glucose. Not eating >24h warrants a vet (sourced); the death threshold below is our assumption."
source = "Purina / Dogwood Animal Hospital: kitten not eating 24h -> call vet"
url = "https://dogwoodanimalhospital.com/kitten-not-eating-for-24-hours/"
reserve_days_max = 1.0        # the reserve holds at most one day of energy; extra becomes body weight
weak_deficit_days = 0.75      # deficit at which the kitten becomes lethargic
critical_deficit_days = 1.75  # deficit at which the kitten is weak and appetite collapses
death_deficit_days = 2.75     # deficit at which the kitten dies


# ── Water ────────────────────────────────────────────────────────────────
[water]
status = "sourced"
source = "AAFP (via Royal Canin Academy): 40-60 ml/kg/day"
url = "https://academy.royalcanin.com/en/veterinary/the-water-requirements-and-drinking-habits-of-cats"
turnover_ml_per_kg_day = 55   # water lost per day; replaced by drinking and by moisture in food
bowl_capacity_ml = 250        # a full water bowl
# assumption: how fast the kitten laps water
drink_ml_per_min = 5.0

# Dehydration is measured as % of body weight lost as water.
[dehydration]
status = "sourced"
source = "Merck Vet Manual / WSAVA fluid therapy: signs from 5%, shock 10-12%, death imminent 12-15%"
url = "https://www.merckvetmanual.com/therapeutics/fluid-therapy/the-fluid-resuscitation-plan-in-animals"
signs_pct = 5                 # first visible signs (tacky gums, slow skin tent)
severe_pct = 10               # shock
death_pct = 14                # the kitten dies


# ── Elimination ──────────────────────────────────────────────────────────
[elimination]
status = "assumption"
note = "Urine ~20 ml/kg/day in 2-4 voids; 1-2 stools/day."
urine_ml_per_kg_day = 20      # urine production
void_threshold_ml_per_kg = 7  # bladder volume at which the kitten needs to pee
stool_per_g_kibble = 0.02     # stools produced per gram of kibble eaten (1.0 = one stool due)
stool_per_g_wet = 0.005       # ... per gram of wet food


# ── Litter box ───────────────────────────────────────────────────────────
[litter]
status = "sourced"
source = "2014 AAFP/ISFM house-soiling guidelines: scoop daily, replenish litter"
url = "https://catvets.com/resource/aafp-isfm-house-soiling-guidelines/"
# assumption: the tolerance and soiling model below
tolerance_deposits = [3, 6]       # per-cat tolerance: number of unscooped deposits the kitten will accept (sampled)
residue_per_scoop = 0.3           # each scoop leaves some smell behind; counts as partial "dirt"
replace_residue_threshold = 4.0   # at this residue the litter is saturated and needs replacing


# ── Sleep ────────────────────────────────────────────────────────────────
[sleep]
status = "assumption"
note = "Kittens sleep ~16-20 h/day."
awake_minutes_per_sleep_minute = 0.33   # one minute asleep pays back this many minutes of being awake


# ── Lily poisoning ───────────────────────────────────────────────────────
# Hours are measured from the moment of exposure (chewing a leaf, licking pollen).
[lily]
status = "sourced"
source = "MSPCA-Angell timeline; ASPCApro treatment window"
url = "https://www.mspca.org/angell_services/lily-toxicity-the-potentially-fatal-danger-to-cats/"
url2 = "https://www.aspcapro.org/resource/how-spot-which-lilies-are-dangerous-cats-plan-treatment"
note = "Vomiting/anorexia 1-3h; polyuria/polydipsia 12-30h; anuria 24-48h; profound weakness 30-72h; death 3-7 days. Treatment started >18h may not reverse damage. Treatment = 48h IV fluid diuresis."
vomit_hours = [1, 3]          # first vomiting
polyuria_hours = [12, 30]     # kidneys failing: drinks and pees a lot
anuria_hours = [24, 48]       # kidneys shut down: no urine
weakness_hours = [30, 72]     # profound weakness
death_hours = [72, 168]       # death if untreated
treat_window_hours = 18       # treatment started within this many hours always works
hospital_hours = 48           # length of IV fluid treatment
# assumption: survival odds when treatment starts after the window
survive_late_pre_anuria = 0.5
survive_post_anuria = 0.1
# assumption: when the bouquet arrives and how likely the kitten is to get into it
event_prob = 0.7                        # chance a seed has the bouquet event at all
event_day = [2, 9]                      # day it arrives (sampled)
exposure_prob_per_visit = [0.10, 0.35]  # chance per exploring visit, scaled by impulsiveness (low to high)
crash_prob = 0.3                        # chance an exposure also knocks the vase over (a loud crash)


# ── Cat flu (upper respiratory infection, URI) ───────────────────────────
[uri]
status = "sourced"
source = "Cornell Feline Health Center / AMC NY: sneezing, eye+nasal discharge, lethargy, appetite loss from lost smell; warmed canned food helps"
url = "https://www.amcny.org/pet_health_library/feline-upper-respiratory-infection-uri/"
# assumption: everything below (course and severity model)
event_prob = 0.6              # chance a seed has cat flu (picked up at the shelter)
onset_day = [1, 5]            # day symptoms start
mild_days = [2, 4]            # how long the mild stage lasts before a severe case worsens
severe_prob = 0.5             # chance the case turns severe if untreated (otherwise it clears on its own)
recover_days = [5, 8]         # days from onset until a mild case clears on its own
appetite_mild = 0.6           # fraction of normal appetite while mild
appetite_severe = 0.1         # ... while severe
warm_wet_appetite_bonus = 0.35  # appetite boost from warmed wet food (the kitten can smell it)
treated_appetite = 0.85       # appetite once antibiotics take effect (ramps up over 12 h)
doses_per_day = 2             # antibiotic schedule
course_days = 7
min_adherence = 0.7           # fraction of doses that must be given or the infection relapses


# ── Vet ──────────────────────────────────────────────────────────────────
[vet]
status = "assumption"
note = "US-typical costs; the vet correctly diagnoses whatever is present (optimistic vet)."
exam_cost = 80                # regular appointment fee ($)
er_cost = 250                 # emergency clinic fee ($)
lily_hospital_cost = 1800     # 48 h of IV fluids
uri_meds_cost = 60            # antibiotics
fluids_cost = 120             # fluids + feeding for a dehydrated/underfed kitten
appointment_hour = 8          # regular appointments are at 08:00
er_trip_minutes = 180         # time away for an emergency visit
appointment_minutes = 90      # time away for a regular appointment


# ── Shop ─────────────────────────────────────────────────────────────────
[shop]
status = "assumption"
kibble_bag = { grams = 1500, cost = 25 }
wet_food = { grams = 85, cost = 2 }       # one can
litter_bag = { refills = 1, cost = 15 }   # enough to fully replace the litter once
toy_wand = { cost = 10 }
litter_box = { cost = 30 }                # an extra box, delivered filled with litter
food_bowl = { cost = 8 }                  # an extra bowl
water_bowl = { cost = 8 }
delivery_hour = 18                        # orders arrive the next day at this hour


# ── Several kittens: resources ───────────────────────────────────────────
[resources]
status = "sourced"
source = "AAFP/ISFM Feline Environmental Needs Guidelines (2013); AAFP/ISFM house-soiling guidelines (2014)"
url = "https://journals.sagepub.com/doi/10.1177/1098612X13477537"
url2 = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11148882/"
note = "One litter box per cat plus one. Food, water and litter boxes should be in several separate places so a cat can reach them without passing another cat; boxes side by side count as one location."
boxes_per_cat_plus = 1        # the guideline number of boxes is cats + this


# ── Several kittens: relationships ───────────────────────────────────────
# Each pair of kittens has a bond from -1 (hostile) to 1 (bonded). Friendly kittens play, groom each other and
# sleep together; hostile ones hiss, fight, and sit by the food bowl or litter box so the other avoids it.
[social]
status = "sourced"
source = "Merck Vet Manual, Social Behavior of Cats: affiliative cats rub, groom and stay close; social play peaks at 6-14 weeks; many cats prefer not to share core resources and time-share them"
url = "https://www.merckvetmanual.com/en-us/veterinary/behavior/behavior-of-cats/social-behavior-of-cats"
# assumption: everything below (how bonds start and change)
start_bond_mean = 0.2         # two shelter kittens are usually friendly, but not always
start_bond_noise = 0.3        # standard deviation of the starting bond
start_bond_per_sociability = 0.3   # each kitten's sociability above 0.5 adds this much (times the excess)
hostile_below = -0.2          # below this bond a kitten treats the other as a rival
groom_above = 0.3             # kittens groom each other only above this bond
sleep_together_above = 0.2    # ... and sleep curled up together only above this
play_bond_gain = 0.03         # each play session together
groom_bond_gain = 0.03
sleep_bond_gain = 0.02
hiss_bond_loss = 0.03
fight_bond_loss = 0.1
play_escalation_base = 0.005  # chance a play session turns into a real fight, plus...
play_escalation_per_bond = 0.4  # ... this times how far the bond is below 0.2
fight_stress = 0.15           # stress added to both kittens by a fight
conflict_cooldown_hours = 3   # after a hiss or fight, a kitten takes this long to be ready to start another
encounter_hiss_prob = 0.5     # walking into a room with an awake rival: chance of hissing, times hostility and boldness
scratch_days = 2              # a fight's loser carries a visible scratch this long
guarded_mult = 0.15           # a resource with an awake rival in the same room is this much less appealing
together_habituation_per_day = 0.02   # bond change per day for kittens that can reach each other
apart_habituation_per_day = 0.1       # ... and for kittens kept apart by a closed door (smell, no fights)
apart_habituation_cap = 0.2           # being kept apart raises the bond to at most this


# ── Several kittens: cat flu spreading ───────────────────────────────────
[contagion]
status = "sourced"
source = "Merck Vet Manual, Feline Respiratory Disease Complex: incubation 2-6 days; spread by droplets and by shared objects (bowls, litter boxes, bedding)"
url = "https://www.merckvetmanual.com/respiratory-system/respiratory-diseases-of-small-animals/feline-respiratory-disease-complex"
incubation_days = [2, 6]
# assumption: infection chances, checked once an hour per pair of kittens
hourly_prob_same_room = 0.02      # the two kittens are in the same room
hourly_prob_shared_home = 0.005   # they can reach each other (shared bowls, litter box, bedding)
treated_shedding = 0.3            # a kitten on antibiotics is this much as contagious


# ── A newcomer kitten ────────────────────────────────────────────────────
[newcomer]
status = "sourced"
source = "AAFP: How to introduce a new cat to other cats (separate room with its own resources for at least 7 days, scent swapping, then gradual contact)"
url = "https://catvets.com/wp-content/uploads/2024/07/Step-by-Step-Guide-How-to-Introduce-a-New-Cat-to-Other-Cats-in-Your-Home.pdf"
# assumption: the starting bond between the newcomer and each resident kitten
start_bond_mean = -0.4
start_bond_noise = 0.15
carrier_minutes = 30          # a newcomer left in its carrier scratches its way out after this long


# ── Helping kittens accept each other ────────────────────────────────────
# Two things the owner can do beyond keeping rivals apart: swap scents with a soft item (a towel rubbed on one
# kitten, left where another kitten can smell it), and short supervised play sessions with two kittens together.
[introductions]
status = "sourced"
source = "AAFP Step-by-Step Guide: How to Introduce a New Cat (2024): swap bedding/soft items daily; rub soft material with one cat's scent on the other's cheeks; short 5-20 min supervised sessions with toys/treats for positive associations, stopped at the first hiss; daily group play with compatible pairs"
url = "https://catvets.com/wp-content/uploads/2024/07/Step-by-Step-Guide-How-to-Introduce-a-New-Cat-to-Other-Cats-in-Your-Home.pdf"
# assumption: the numbers below
scent_fresh_hours = 24             # a rubbed towel smells of the kitten for this long (the guide says repeat daily)
scent_habituation_per_day = 0.15   # extra bond gain per day for a kitten that can smell the other's towel
scent_cap = 0.2                    # scent alone raises the bond to at most this (accepting, not yet friends)
session_calm_gain = 0.06           # bond gain from a supervised session that stays calm
session_tension_per_10min = 0.5    # chance of tension per 10 minutes, times how hostile the pair is (0-1)
session_tension_base = 0.03        # ... plus this, even for friendly kittens
session_tense_bond_loss = 0.05     # a session that ends in hissing
session_fight_chance = 0.25        # chance a tense session becomes a scuffle, times hostility
